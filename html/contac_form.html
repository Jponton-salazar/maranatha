<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="La Buena Semilla - Emisora con música y locución evangelica">
    <meta name="keywords" content="radio online, emisora en linea, radio evangelica, la buena semilla">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/sesion.css">
    <link rel="shortcut icon" href="../image/logo.png" type="image/x-icon">
    <title>La Buena Semilla</title>
</head>
<body class="wrapper">
    <header>
        <div class="logo">
            <a href="/index.html"><img src="../image/logo.png" class="image" alt="logo_emisora"></a>
            <h3 class="title">La Buena Semilla</h3>
        </div>
        <nav class="nav">
            <input type="checkbox" id="menu-toggle">
            <ul class="menu_list">
                <li class="list_item"><a href="/index.html" class="link">Inicio</a></li>
                <li class="list_item"><a href="../html/acerca.html" class="link">La Radio</a></li>
                <li class="list_item"><a href="../html/contac_form.html" class="link">Contacto</a></li>
            </ul>
            <label for="menu-toggle" class="menu-icon">
                <img src="../image/icons8-menú-50.png" alt="menu">
            </label>
        </nav>
    </header>
    <main>
       <form id="loginForm" class="form">
        <h1 class="form_title">Inicie Sesión</h1>

        <div id="mensajeLogin" class="mensaje"></div>

        <div class="form_inputs">
            <label class="form_label">
                <input type="email" id="loginCorreo" placeholder="" class="form_input" required>
                <span class="form_text">Ingrese su Correo</span>
            </label>

            <label class="form_label">
                <input type="password" id="loginContraseña" placeholder="" class="form_input" required>
                <span class="form_text">Ingrese su Contraseña</span>
            </label>
        </div>

        <button type="submit" class="form_submit">Iniciar Sesión</button>

        <div class="parametros">
            <div class="recordar"><a href="#" id="olvidoContraseña">¿Olvidó su contraseña?</a></div>
            <div class="registro"><a href="#" id="irRegistro">Registrarse</a></div>
        </div>
    </form> 
    <iframe name="contenedorPlayer" class="cuadroBordeado" allow="autoplay" width="500px" height="50px" marginwidth=0 marginheight=0 hspace=0 vspace=0 frameborder=0 scrolling=no  src="https://cp.usastreams.com/pr2g/APPlayerRadioHTML5.aspx?stream=https://stream.zeno.fm/niwvskrwtc8tv&fondo=04&formato=mp3&color=11&titulo=2&autoStart=1&vol=7&tipo=1&nombre=Maranatha+Stereo&botonPlay=1"></iframe>
    </main>
    <script src="../js/auth.js"></script>
    <footer>
        <div class="info">
            <span>&copy; Derechos Reservados | 2025</span> <br>
        </div>
        <div class="contacto">
            <em>jerwebsite@gmail.com</em>
        </div>
        <div class="redes">
            redes aqui
        </div>
    </footer>
</body>
</html>
